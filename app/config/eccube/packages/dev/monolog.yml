monolog:
    channels: ['deprecation']
    handlers:
        main:
            type: rotating_file
            path: '%kernel.logs_dir%/%kernel.environment%/site.log'
            level: debug
            formatter: eccube.log.formatter.line
            max_files: 10
            channels: ['!deprecation']
        console:
            type: console
            process_psr_3_messages: false
            channels: ['!event', '!doctrine', '!console', '!deprecation']
        deprecation:
            type: "null"
            channels: ['deprecation']
